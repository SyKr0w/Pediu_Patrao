<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<body>
    <div th:fragment="content">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h2>Clientes</h2>
            <a th:if="${perfilAtual == 'ATENDENTE'}" class="btn btn-primary" th:href="@{/clientes/novo}">+ Cliente</a>
        </div>

        <div th:if="${erro}" class="alert alert-danger" th:text="${erro}"></div>
        <div th:if="${sucesso}" class="alert alert-success" th:text="${sucesso}"></div>

        <table class="table table-striped">
            <thead>
                <tr>
                    <th>Nome</th>
                    <th>Telefone</th>
                    <th>Endereço</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody>
                <tr th:if="${#lists.isEmpty(clientes)}">
                    <td colspan="4">Nenhum cliente.</td>
                </tr>
                <tr th:each="c : ${clientes}">
                    <td th:text="${c.nome}"></td>
                    <td th:text="${c.telefone}"></td>
                    <td th:text="|${c.logradouro}, ${c.numero}, ${c.bairro}, ${c.cidade}|"></td>
                    <td>
                        <a th:if="${perfilAtual == 'ATENDENTE'}"
                           th:href="@{/clientes/editar/{id}(id=${c.id})}"
                           class="btn btn-sm btn-outline-primary">Editar</a>

                        <form th:if="${perfilAtual == 'GERENTE'}"
                              th:action="@{/clientes/excluir/{id}(id=${c.id})}"
                              method="post"
                              class="d-inline"
                              onsubmit="return confirm('Excluir cliente?')">
                            <button class="btn btn-sm btn-outline-danger">Excluir</button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</body>

</html>
