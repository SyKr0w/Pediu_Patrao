<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<body>
    <div th:fragment="content">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h2>Pedidos</h2>
            <a th:if="${perfilAtual == 'ATENDENTE' or perfilAtual == 'GERENTE'}"
               th:href="@{/pedidos/novo}" class="btn btn-primary">+ Novo pedido</a>
        </div>

        <div th:if="${erro}" class="alert alert-danger" th:text="${erro}"></div>
        <div th:if="${sucesso}" class="alert alert-success" th:text="${sucesso}"></div>

        <div class="table-responsive">
            <table class="table table-striped align-middle">
                <thead>
                    <tr>
                        <th>Cliente</th>
                        <th>Itens</th>
                        <th>Entrada</th>
                        <th>Saída</th>
                        <th>Valores (R$)</th>
                        <th>Status</th>
                        <th th:if="${perfilAtual == 'GERENTE'}">Ações do gerente</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${#lists.isEmpty(pedidos)}">
                        <td th:colspan="${perfilAtual == 'GERENTE' ? 7 : 6}">Nenhum pedido registrado.</td>
                    </tr>

                    <tr th:each="p : ${pedidos}">
                        <td th:text="${nomesClientes[p.clienteId] ?: 'Cliente não encontrado'}"></td>
                        <td>
                            <div th:each="i : ${p.itens}"
                                 th:text="|${i.produtoNome} x${i.quantidade} (R$ ${i.precoUnitario})|"></div>
                            <span th:if="${p.itens == null or #lists.isEmpty(p.itens)}"
                                  th:text="|${p.sabor} x${p.quantidade} (legado)|"></span>
                        </td>
                        <td class="small">
                            <span th:text="${p.entradaEm}"></span>
                            <div th:text="${p.entradaPor}"></div>
                        </td>
                        <td class="small">
                            <span th:text="${p.saidaEm}"></span>
                            <div th:text="${p.saidaPor}"></div>
                        </td>
                        <td>
                            <div th:text="|Subtotal: ${p.subtotal}|"></div>
                            <div th:text="|Desconto: ${p.percentualDesconto}%|"></div>
                            <b th:text="|Total: ${p.total}|"></b>
                        </td>
                        <td>
                            <span class="badge bg-secondary" th:text="${p.status}"></span>
                        </td>
                        <td th:if="${perfilAtual == 'GERENTE'}" style="min-width:210px">
                            <form th:if="${!#lists.isEmpty(proximos[p.id])}"
                                  th:action="@{/pedidos/{id}/status(id=${p.id})}"
                                  method="post" class="mb-2 d-flex gap-1">
                                <select name="status" class="form-select form-select-sm" required>
                                    <option th:each="s : ${proximos[p.id]}"
                                            th:value="${s}" th:text="${s}"></option>
                                </select>
                                <button type="submit" class="btn btn-sm btn-outline-primary">Avançar</button>
                            </form>

                            <div th:if="${p.status == 'RECEBIDO' or p.status == 'EM_PREPARACAO' or p.status == 'PRONTO'}">
                                <form th:action="@{/pedidos/{id}/desconto(id=${p.id})}"
                                      method="post" class="mb-2 d-flex gap-1">
                                    <input name="percentual" type="number" min="0" max="20" step="0.01"
                                           required placeholder="%" class="form-control form-control-sm"/>
                                    <button type="submit" class="btn btn-sm btn-outline-success">Desconto</button>
                                </form>

                                <form th:action="@{/pedidos/{id}/cancelar(id=${p.id})}"
                                      method="post" class="d-flex gap-1"
                                      onsubmit="return confirm('Confirmar cancelamento?')">
                                    <input type="text" name="justificativa" maxlength="500" required
                                           placeholder="Justificativa" class="form-control form-control-sm"/>
                                    <button type="submit" class="btn btn-sm btn-danger">Cancelar</button>
                                </form>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>

</html>
