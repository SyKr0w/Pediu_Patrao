<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<body>
    <div th:fragment="content">
        <h2>Cadastro de produto</h2>

        <form th:action="@{/produtos/salvar}" th:object="${produto}"
              method="post" class="card card-body" style="max-width:650px">
            <input type="hidden" th:field="*{id}"/>

            <label>Nome</label>
            <input class="form-control mb-3" th:field="*{nome}" required/>

            <label>Tipo</label>
            <select class="form-select mb-3" th:field="*{tipo}">
                <option value="Pizza">Pizza</option>
                <option value="Bebida">Bebida</option>
                <option value="Porção">Porção</option>
                <option value="Adicional">Adicional</option>
                <option value="Lanche">Lanche</option>
            </select>

            <label>Preço</label>
            <input class="form-control mb-3" th:field="*{preco}"
                   type="number" min="0" step="0.01" required/>

            <label>
                <input type="checkbox" th:field="*{ativo}"/> Produto ativo
            </label>

            <div class="mt-3">
                <button class="btn btn-primary">Salvar</button>
                <a class="btn btn-link" th:href="@{/produtos}">Voltar</a>
            </div>
        </form>
    </div>
</body>

</html>
