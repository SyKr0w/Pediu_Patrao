<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<body>
    <div th:fragment="content">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h2>Produtos</h2>
            <a th:if="${perfilAtual == 'GERENTE'}"
               class="btn btn-primary" th:href="@{/produtos/novo}">+ Produto</a>
        </div>

        <div th:if="${erro}" class="alert alert-danger" th:text="${erro}"></div>
        <div th:if="${sucesso}" class="alert alert-success" th:text="${sucesso}"></div>

        <table class="table table-striped">
            <thead>
                <tr>
                    <th>Nome</th>
                    <th>Tipo</th>
                    <th>Preço</th>
                    <th>Ativo</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody>
                <tr th:if="${#lists.isEmpty(produtos)}">
                    <td colspan="5">Nenhum produto cadastrado.</td>
                </tr>
                <tr th:each="p : ${produtos}">
                    <td th:text="${p.nome}"></td>
                    <td th:text="${p.tipo}"></td>
                    <td th:text="${p.preco}"></td>
                    <td th:text="${p.ativo}"></td>
                    <td>
                        <a th:if="${perfilAtual == 'GERENTE'}"
                           th:href="@{/produtos/editar/{id}(id=${p.id})}"
                           class="btn btn-sm btn-outline-primary">Editar</a>

                        <form th:if="${perfilAtual == 'GERENTE'}"
                              th:action="@{/produtos/excluir/{id}(id=${p.id})}"
                              method="post" class="d-inline"
                              onsubmit="return confirm('Excluir produto?')">
                            <button class="btn btn-sm btn-outline-danger">Excluir</button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</body>

</html>
