<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<body>
    <div th:fragment="sidebar" id="sidebar">
        <h4 class="text-center py-3">🍕 PediuPatrão</h4>
        <div class="text-center text-light small mb-3">
            <span th:text="${nomeAtual}"></span> · <b th:text="${perfilAtual}"></b>
        </div>

        <ul class="nav flex-column">
            <li class="nav-item">
                <a class="nav-link" th:href="@{/}"><i class="bi bi-house"></i> Home</a>
            </li>
            <li class="nav-item" th:if="${perfilAtual == 'ATENDENTE' or perfilAtual == 'GERENTE'}">
                <a class="nav-link" th:href="@{/clientes}"><i class="bi bi-people"></i> Clientes</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" th:href="@{/pedidos}"><i class="bi bi-bag"></i> Pedidos</a>
            </li>
            <li class="nav-item" th:if="${perfilAtual == 'ATENDENTE' or perfilAtual == 'GERENTE'}">
                <a class="nav-link" th:href="@{/produtos}"><i class="bi bi-box"></i> Produtos</a>
            </li>
            <li class="nav-item" th:if="${perfilAtual == 'ADMIN'}">
                <a class="nav-link" th:href="@{/usuarios}"><i class="bi bi-person-gear"></i> Usuários</a>
            </li>
            <li class="nav-item" th:if="${perfilAtual == 'ADMIN' or perfilAtual == 'GERENTE'}">
                <a class="nav-link" th:href="@{/auditoria}"><i class="bi bi-clock-history"></i> Auditoria</a>
            </li>
        </ul>

        <form th:action="@{/logout}" method="post" class="p-3">
            <button class="btn btn-outline-light btn-sm w-100" type="submit">Sair</button>
        </form>
    </div>
</body>

</html>
